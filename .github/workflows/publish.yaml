name: Publish

# Direct-publish flow (mirrors onyx-core): merging to main IS the release.
# CI consumes pending changesets (`changeset version`), commits the bump
# back to main with [skip ci], then builds, tests and publishes to npm.
# With no pending changesets the run is a no-op (publish is idempotent).

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Reads the version from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify npm auth (fail fast on dead token)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm whoami; then
            echo "::error title=npm auth failed::NPM_TOKEN is missing/expired — mint a granular automation token with read/write on image-cache-pro and update the repo secret."
            exit 1
          fi

      - name: Version packages (consume changesets)
        run: pnpm exec changeset version

      - name: Commit version bump back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git commit -m "chore: version packages [skip ci]"; then
            git push origin main
          else
            echo "No pending changesets — nothing to version."
          fi

      - name: Build, test and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm release

      - name: Push release tags
        run: git push --tags origin main
